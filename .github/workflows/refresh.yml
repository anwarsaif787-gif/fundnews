name: Refresh news
on:
  schedule:
    - cron: "*/14 * * * *"   # also keeps the free site awake
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to fetch new stories
        run: curl -fsS --retry 3 --max-time 120 "${{ secrets.SITE_URL }}/refresh/${{ secrets.REFRESH_TOKEN }}/"
