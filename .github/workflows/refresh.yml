name: Refresh news
on:
  schedule:
    - cron: "*/14 * * * *"   # also keeps the free site awake
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to fetch new stories
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          SITE=$(echo "$SITE_URL" | tr -d '[:space:]')
          SITE=${SITE%/}
          TOKEN=$(echo "$REFRESH_TOKEN" | tr -d '[:space:]')
          echo "address length: ${#SITE}, token length: ${#TOKEN}"
          curl -fsS --retry 3 --max-time 120 "$SITE/refresh/$TOKEN/"
