services:
  - type: web
    name: fundnews
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fundnews-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_TOKEN
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: fundnews-db
    plan: free
